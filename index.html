<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To Do List</title>
    <style>
        /* 2.排版 */
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: rgb(103, 148, 168);
        }

        .container {
            width: 90%;
            max-width: 600px;
            margin: 50px auto;
            background-color: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 0 10px rgba(0, 0, 0, .1);
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        .input-area {
            display: flex;
            gap: 10px;
        }

        input {
            flex: 1;
            padding: 10px;
            font-size: 16px;
            border-radius: 10px;
        }

        button {
            cursor: pointer;
            padding: 10px 15px;
            background-color: rgb(183, 231, 233);
            border-radius: 10px;

            transition: all 0.3s;
        }

        button:hover {
            transform: translateY(-2px);
            background-color: #b9d0eb;
        }

        .active {
            background: #2564cf;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 2px 8px rgba(37, 100, 207, .3);
        }

        .filter-area {
            margin-top: 15px;
            display: flex;
            gap: 10px;
        }

        #showList {
            margin-top: 20px;
            padding: 0;
        }

        .todo-item {
            list-style: none;

            display: flex;
            justify-content: space-between;
            align-items: center;

            padding: 12px;
            margin-bottom: 10px;

            background: #f5f5f5;
            border-radius: 8px;
        }

        .todo-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* 已完成刪除線 */
        .completed {
            text-decoration: line-through;
            color: gray;
        }

        /* 分類樣式 */
        .tag {
            margin-left: 10px;
            padding: 2px 8px;
            border-radius: 20px;
            font-size: 12px;
            background: #cecece;
        }

        /* checkbox完成改成圓圈 */
        .circle-btn {
            appearance: none;
            width: 24px;
            height: 24px;
            border: 2px solid #2564cf;
            border-radius: 50%;
            cursor: pointer;
            position: relative;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .circle-btn:checked {
            background-color: #2564cf;
        }

        .circle-btn:checked::after {
            content: "";
            color: white;
            position: absolute;
            left: 5px;
            top: 0px;
            font-size: 14px;
        }

        .circle-btn.done {
            background: #4aa3df;
            color: white;
        }
    </style>
</head>

<body>
    <!-- 1.建立畫面 -->
    <div class="container">
        <h1>📝代辦事項 To Do List</h1>
        <div class="input-area">
            <input id="newobject" type="text" placeholder="新增任務">
            <button id="onebtn" class="category-btn active" type="button" data-category="personal">個人</button>
            <button id=" workBtn" class="category-btn" type="button" data-category="work">工作</button>
            <button id="newbtn" type="button">新增</button>
        </div>

        <div class="filter-area ">
            <button id="allbtn" class="status-btn" data-status="all" type="button">全部</button>
            <button id="nobtn" class="status-btn" data-status="active" type="button">未完成</button>
            <button id="yesbtn" class="status-btn" data-status="completed" type="button">已完成</button>
            <button id="wkbtn" class="category-filter" data-category="work" type="button">工作</button>
            <button id="mybtn" class="category-filter" data-category="personal" type="button">個人</button>
        </div>
        <ul id="showList"></ul>
    </div>
    <!-- 3.互動 -->
    <script>
        // ====================
        // 資料
        // ====================
        //初始化資料
        let todos = JSON.parse(localStorage.getItem("todos") || "[]");
        // 新增分類變數
        let statusFilter = "all";      // all / active / completed
        let categoryFilter = "all";    // all / work / personal
        let currentCategory = "personal";
        // ====================
        // DOM
        // ====================
        const newobject = document.querySelector("#newobject");
        const newbtn = document.querySelector("#newbtn");
        const onebtn = document.querySelector("#onebtn");
        const workBtn = document.querySelector("#workBtn");
        const allbtn = document.querySelector("#allbtn");
        const nobtn = document.querySelector("#nobtn");
        const yesbtn = document.querySelector("#yesbtn");
        const wkbtn = document.querySelector("#wkbtn");
        const mybtn = document.querySelector("#mybtn");
        const showList = document.querySelector("#showList");
        //先建立群組(陣列)
        const statusButtons = [allbtn, nobtn, yesbtn];
        const categoryButtons = [wkbtn, mybtn];
        // ====================
        // 儲存資料
        // ====================
        function saveTodos() {
            localStorage.setItem("todos", JSON.stringify(todos));
        }
        //統一更新流程
        function update() {
            saveTodos();
            render();
        }
        // ====================
        // 新增任務
        // ====================
        function addTodo() {
            const text = newobject.value.trim();
            if (!text) return alert("請輸入任務內容");
            // 新增任務時記錄分類
            const todo = {
                id: Date.now(), text: text, done: false, category: currentCategory
            };
            todos.push(todo);
            newobject.value = "";
            update();
        }
        // ====================
        // 刪除任務
        // ====================
        function deleteTodo(id) {
            todos = todos.filter(t => t.id !== id);
            update();
        }
        // ====================
        // 完成任務
        // ====================
        function toggleTodo(id) {
            todos = todos.map(t =>
                t.id === id ? { ...t, done: !t.done } : t
            );
            update();
        }
        // ====================
        // 篩選資料
        // ====================
        function getFilteredTodos() {
            return todos.filter(todo => {
                // 狀態篩選
                const statusOK =
                    statusFilter === "all" ||
                    (statusFilter === "active" && !todo.done) ||
                    (statusFilter === "completed" && todo.done);
                const categoryOK =
                    categoryFilter === "all" ||
                    todo.category === categoryFilter;
                return statusOK && categoryOK;
            });
        }
        // ====================
        // 畫面渲染
        // ====================
        function render() {
            showList.innerHTML = "";
            const data = getFilteredTodos();
            console.log(todos);

            data.forEach(todo => {
                // 建議是使用js新增元件/innerHTML 則一使用
                // const li = document.createElement("li");
                // li.classList.add("todo-item");
                showList.innerHTML += `
                    <li class="todo-item">
                        <div class="todo-left">
                            <span class="circle-btn ${todo.done ? "done" : ""}" data-id="${todo.id}">
                        ${todo.done ? "✔" : ""}</span>
                        <span class="${todo.done ? "completed" : ""}">${todo.text}</span>
                        <span class="tag">${todo.category === "work" ? "工作" : "個人"}</span>
                    </div>
                    <button class="delete-btn"data-id="${todo.id}">刪除</button>
        `;
                // showList.appendChild(li);
            });

            bindEvents();
        }
        // ====================
        // 綁定事件
        // ====================
        function bindEvents() {
            document.querySelectorAll(".circle-btn").forEach(btn => {
                btn.addEventListener("click", function () {
                    const id = Number(this.dataset.id);
                    toggleTodo(id);
                });
            });
            document.querySelectorAll(".delete-btn").forEach(btn => {
                btn.addEventListener("click", function () {
                    const id = Number(this.dataset.id);
                    deleteTodo(id);
                });
            });
        }
        // ====================
        // 按鈕事件
        // ====================
        newbtn.addEventListener("click", addTodo);
        newobject.addEventListener("keydown", (e) => {
            if (e.key === "Enter") {
                addTodo();
            }
        });
        //狀態按鈕
        document.querySelectorAll(".status-btn").forEach(btn => {
            btn.addEventListener("click", () => {
                statusFilter = btn.dataset.status;
                setActiveButton(btn, statusButtons);
                // 顯示所有分類
                if (statusFilter === "all") {
                    categoryFilter = "all";
                    // 分類按鈕取消選取
                    categoryButtons.forEach(btn => {
                        btn.classList.remove("active");
                    });
                }
                render();
            });
        });

        //個人.工作選項切換
        document.querySelectorAll(".category-btn").forEach(btn => {
            btn.addEventListener("click", () => {
                currentCategory = btn.dataset.category;
                document.querySelectorAll(".category-btn")
                    .forEach(b => b.classList.remove("active"));
                btn.classList.add("active");
            });
        });
        //分類按鈕
        //分類按鈕
        // 跑回圈的方式搭配data-*取得(categoryFilter)來綁定監聽事件
        // array.forEach(element => {
        //     element.addEventListener(
        //         element.dataset.XXXX 
        //         render();
        //     )
        // });
        document.querySelectorAll(".category-filter").forEach(btn => {
            btn.addEventListener("click", () => {
                categoryFilter = btn.dataset.category
                setActiveButton(btn, categoryButtons);
                render();
            });
        });
        // 切換按鈕狀態
        function setActiveButton(button, group) {
            // 先把同群組按鈕的 active 移除
            group.forEach(btn => {
                btn.classList.remove("active");
            });
            // 再加到目前按鈕
            button.classList.add("active");
        }
        //初始化
        setActiveButton(allbtn, statusButtons);
        render();
    </script>
</body>

</html>
